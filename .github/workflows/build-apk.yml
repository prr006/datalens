name: Build DataLens APK

on:
  push:
    branches:
      - main
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Verify APK artifact
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK" || { echo "APK missing or empty"; exit 1; }
          ls -la "$APK"
          unzip -l "$APK" | head -40
          unzip -l "$APK" | grep -q "classes.dex" || { echo "classes.dex missing"; exit 1; }
          unzip -l "$APK" | grep -q "AndroidManifest.xml" || { echo "manifest missing"; exit 1; }
          unzip -l "$APK" | grep -q "resources.arsc" || { echo "resources.arsc missing"; exit 1; }
          # Dump badging with aapt if available (best effort).
          AAPT="$(ls "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$AAPT" ] && [ -x "$AAPT" ]; then
            "$AAPT" dump badging "$APK" | head -5
            "$AAPT" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion" || true
          fi

      - name: Copy APK to releases/
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/DataLens-debug.apk
          sha256sum releases/DataLens-debug.apk | tee releases/DataLens-debug.apk.sha256
          ls -la releases/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DataLens-debug-apk
          path: releases/DataLens-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit APK artifact to branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/DataLens-debug.apk releases/DataLens-debug.apk.sha256
          if git diff --cached --quiet; then
            echo "No artifact changes to commit."
            exit 0
          fi
          git commit -m "ci: add debug APK artifact [skip ci]"
          for i in 1 2 3 4 5; do
            if git fetch origin "$BRANCH" && git rebase "origin/$BRANCH" && git push origin "HEAD:$BRANCH"; then
              echo "Artifact pushed."
              exit 0
            fi
            echo "Push failed (attempt $i); retrying after rebase…"
            sleep 5
            git rebase --abort 2>/dev/null || true
          done
          echo "Could not push the artifact commit; the workflow artifact still contains the APK."
          exit 1
